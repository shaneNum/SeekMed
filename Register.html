<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SeekMed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Login.css"> <!-- pakai CSS sama seperti login -->
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">Create Your Account</h2>
        <p class="login-subtitle">Sign up to start using SeekMed</p>
        <form action="RegisterProcess.php" method="POST" class="login-form">
            <input type="email" name="email" placeholder="Email" required>
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit" class="btn-login">Sign Up</button>
        </form>
        <p class="signup-link">Already have an account? <a href="Login.html">Login</a></p>
    </div>
</body>
</html>
